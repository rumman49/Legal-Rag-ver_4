[project]
name = "legal-rag-studio"
version = "0.1.0"
description = "Multilingual Legal RAG Studio for Indian Law"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    "ollama>=0.3.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "pypdf>=4.3.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=1.1.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.10",
    "mysql-connector-python>=26.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

